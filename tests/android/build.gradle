buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.10.1'
    }
}

apply plugin: 'com.android.application'

android {
    compileSdkVersion = 36

    defaultConfig {
      namespace = 'com.ayogo.cordova.appscope.tests'
      applicationId = 'com.ayogo.cordova.appscope.tests'
      minSdkVersion = 24
      targetSdkVersion = 36
      versionCode = 1
      versionName = '1.0'
      testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaLanguageVersion.of(11)
        targetCompatibility JavaLanguageVersion.of(11)
    }

    buildTypes {
      debug {
        testCoverageEnabled = true
      }
    }

    sourceSets {
        main {
            java {
                srcDir("../../src/android")
            }
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'org.apache.cordova:framework:[11.0.0,)'

    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.robolectric:robolectric:4.16.1"
    testImplementation "androidx.test.ext:junit:1.3.0"

    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'

    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.0") {
            because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.1.0") {
            because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
        }
    }
}
